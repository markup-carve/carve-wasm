name: Release notes check

on:
  pull_request:
    paths:
      - 'tools/check-release-notes.py'
      - 'tools/test-release-notes.py'
      - 'tools/run-release-notes-gate.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/rehearse-release-notes.yml'
  push:
    branches: [main]
    paths:
      - 'tools/check-release-notes.py'
      - 'tools/test-release-notes.py'
      - 'tools/run-release-notes-gate.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/rehearse-release-notes.yml'

# A new push cancels the superseded run of the same pull request; other
# events get a group per run so nothing queued is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check release-note comparison and rejection cases
        run: python3 tools/test-release-notes.py
