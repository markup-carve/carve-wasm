name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# The publish is split off from the build so that it can be REACHED only
# through a gate. This file used to be one job: `wasm-pack build` followed
# directly by `npm publish`, with nothing between them that could return a
# non-zero exit code. Whatever the build produced went to the registry, and a
# registry publish is not retractable in any useful sense - it is indexed
# within minutes, and a deprecate or an unpublish is itself a public event.
#
# Ordering inside one job would not be enough. Steps in a job are only as
# blocking as their `if:` and `continue-on-error:` say they are, and a step
# added between them later inherits nothing. A separate job named in `needs:`
# cannot be reached at all while the gate fails, which is the property being
# bought here.
jobs:
  # Everything that decides whether this tag is publishable.
  verify:
    name: Gate the release on the packed artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned, because without it the action installs whatever "latest"
          # means on the day - so the artifact this repository ships is rebuilt
          # by a tool nothing here records, and two runs of the same commit are
          # not the same build.
          version: 'v0.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The corpus is the only check that can tell a drifted engine pin from a
      # current one; smoke.mjs asserts hand-written expectations, which a stale
      # engine satisfies happily. The gate script refuses to run without it
      # rather than skipping, so a spec checkout that failed to appear fails the
      # release instead of certifying it.
      #
      # AGAINST THE SPEC COMMIT THE PINNED ENGINE PINS, not against spec main.
      # This is a deliberate NARROWING of what this gate refuses, and it is the
      # reason the gate exists at all rather than being switched off.
      #
      # It used to check out markup-carve/carve at its default branch, which
      # asks whether the package is conformant with the spec as it stands right
      # now. No change in this repository can answer yes to that: the spec adds
      # documents continuously and an engine implements them some time later, so
      # between those two moments the gate cannot pass by construction, and a
      # gate that cannot pass gets skipped - the "check that cannot fail" of
      # markup-carve/carve#755 arriving from the opposite direction.
      #
      # It is what stopped the sibling binding carve-py mid-release. Its v0.1.1
      # built all three wheels and published its GitHub release, then skipped
      # the PyPI upload over two documents from corpus category 367, which does
      # not exist at the spec commit that release pins and which no engine
      # revision available that day rendered. PyPI went on serving the version
      # the security fix was for. This repository's first release would have
      # met the same wall.
      #
      # So it now holds the package to the spec the engine inside it was written
      # against: scripts/pinned-spec-commit.py reads the carve-rs revision
      # Cargo.toml pins, cross-checks it against what Cargo.lock resolved, and
      # takes that revision's tests/spec gitlink. Every input is pinned in this
      # repository, so the answer cannot change while this repository does not,
      # and a failure is cleared by bumping the pin - an action taken here.
      #
      # WHAT IT STILL REFUSES, unchanged: a package whose engine renders any of
      # the documents that engine claims to implement differently, a corpus that
      # is truncated or stale relative to what the spec's example pages declare,
      # and a `files` list that leaves a payload file out of the tarball.
      #
      # WHAT MOVED TO NON-BLOCKING: how far this package is from spec MAIN. That
      # is reported by the corpus-drift job in ci.yml, on every push, every pull
      # request and a daily schedule.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          # fetch-depth: 0 so the pinned revision can be read as a tree. A
          # shallow clone has the tip's tree and nothing else, and the pin is
          # deliberately not required to be the tip.
          fetch-depth: 0

      - name: Resolve the spec commit the pinned engine pins
        id: pin
        run: |
          spec="$(python3 scripts/pinned-spec-commit.py \
            --engine carve-rs --manifest Cargo.toml --lock Cargo.lock)"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Check out the spec corpus that engine was written against
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          ref: ${{ steps.pin.outputs.spec }}
          path: spec

      # The tag is the version being published, so it is the version the
      # package must carry. A mismatch publishes a number nobody asked for, and
      # like everything else on this path it cannot be taken back.
      - name: The tag and the package version have to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag: $tag, Cargo.toml: $declared"
          if [ "$tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($declared)"
            exit 1
          fi

      # The exact command the publish is about, so the gate measures the
      # bundler package users install rather than a differently-targeted build
      # of the same source.
      - name: Build wasm package
        run: wasm-pack build --target bundler --scope markup-carve

      # Packs `pkg/` with `npm pack`, unpacks the tarball, and runs
      # tests/smoke.mjs and tests/corpus.mjs against the UNPACKED tree. A file
      # the generated `files` list leaves out never reaches the registry and
      # never reaches these tests either, so the two cannot disagree. Non-zero
      # on any divergence; the corpus population is derived from the spec's
      # example pages, so a truncated corpus fails here rather than passing
      # over a subset.
      - name: Gate
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: node scripts/verify-release-artifact.mjs

      # Hand the VERIFIED files to the publish job rather than letting it build
      # its own. A second build would be a second artifact, and the one that was
      # measured would not be the one uploaded.
      - name: Upload the verified package
        uses: actions/upload-artifact@v4
        with:
          name: verified-package
          path: release-artifact/package/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    # Not reachable while `verify` fails, cancels, or is skipped.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # `write`, not `read`, and the gate below is the whole reason: a DRAFT
      # release is invisible to a caller without push access, so under
      # `contents: read` the listing comes back without it and the gate reports
      # "no release" for a draft that is sitting right there with notes in it.
      # It went unnoticed through 0.1.0 and 0.1.1 because both were published
      # before their tags were pushed, and a published release IS visible with
      # `read` (#80).
      contents: write
      id-token: write
    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Slurped with `jq -s`, not with `gh --jq`. `gh api --paginate`
          # applies its own `--jq` to EACH PAGE, so once this repository has
          # more than one page of releases the filter emits one result per page
          # - the match on one, `null` on the others - and everything below
          # would be reading a two-line string. Here `gh` returns the raw pages
          # and one jq pass flattens them. `--arg` rather than interpolation,
          # so the tag never has to survive two levels of quoting.
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            | jq -s --arg tag "$GITHUB_REF_NAME" \
                '[.[][] | select(.tag_name == $tag)] | first')"
          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "::error::no release for $GITHUB_REF_NAME. Write the notes first:" \
                 "gh release create $GITHUB_REF_NAME --draft --notes-file NOTES.md"
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write (#80)"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $GITHUB_REF_NAME has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'
          printf '%s' "$release" | jq -er '.id' > "$RUNNER_TEMP/release-id"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download the verified package
        uses: actions/download-artifact@v4
        with:
          name: verified-package
          path: pkg

      # Cheap restatement of what the gate already proved, because this job
      # gets its files over the network: an empty or partial download would
      # otherwise publish a package with no payload in it.
      - name: The downloaded package is the whole package
        working-directory: pkg
        run: |
          ls -l
          for file in package.json carve_wasm.js carve_wasm_bg.js carve_wasm_bg.wasm; do
            test -s "$file" || { echo "verified package is missing $file"; exit 1; }
          done

      - name: Publish to npm
        working-directory: pkg
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A registry publish is not finished until the release page exists. The
      # tag is pushed, CI publishes, the registry answers 200, and "released"
      # feels done - while `/releases` shows nothing, so a reader has no notes
      # and no changelog for the version they just installed. Doing it here
      # rather than by hand also means the draft stops being a thing someone
      # has to remember to publish at the right moment.
      #
      # Last, deliberately: a draft that stays a draft is recoverable, and one
      # published beside a failed npm publish is not.
      - name: Publish the release notes
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(cat "$RUNNER_TEMP/release-id")"
          case "$id" in
            ''|*[!0-9]*)
              echo "::error::release id is not a number: [$id]"; exit 1 ;;
          esac
          # `tag_name` goes with every PATCH of a release. Omit it on a DRAFT
          # and GitHub replaces the tag with a generated `untagged-*`
          # placeholder, because a draft's tag is a string on the object rather
          # than a git ref - so the field has nothing to fall back to.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$GITHUB_REF_NAME" -F draft=false --jq '"published \(.tag_name)"'
          # Read it back: exit status does not tell you whether the tag survived.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"draft=\(.draft) tag=\(.tag_name)"'
