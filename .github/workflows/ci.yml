name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The corpus job below is the only check that can tell a drifted pin from a
  # current one, and it can start failing without a single commit here: the
  # SPEC moves, the pinned engine does not, and a push-triggered run reports
  # the state of the day someone last touched this repo. A scheduled run is
  # what turns that into a red build instead of silence.
  #
  # This one GATES rather than reports. A corpus divergence is not upstream
  # being ahead, it is this artifact rendering documents wrongly today.
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:

jobs:
  # Which carve-rs is this package running, and is that a revision that really
  # exists on `main`? Nothing here read the pin before: no `rev-list`, no
  # `merge-base`, no reference to it at all. Part of why that looked guarded is
  # that the pin is hard to find, because the engine crate publishes as
  # `carve-lang`, not `carve` (the name was taken on crates.io), and this
  # manifest spells the dependency key `carve` while the lockfile names the
  # package `carve-lang`.
  #
  # The corpus job below answers whether a drifted pin MATTERS; it is blind to
  # any engine change no corpus document exercises (markup-carve/carve-rs#449 is
  # the concrete case, where openers past the nesting cap were discarded and the
  # rendered HTML was byte-identical either way). This job answers whether the
  # pin is real, and it keeps asserting that with the pin sitting exactly on the
  # engine's tip.
  #
  # It is deliberately NOT a distance check. carve-rs merges continuously, so
  # "fail when behind main" would be red from the moment any PR opens there and
  # unclearable by the action it recommends. The lag is printed as a number;
  # only AGE can fail this job.
  engine-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fetch-depth: 0 is required. The guard runs `merge-base --is-ancestor`
      # against main, which needs the history to be there.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          fetch-depth: 0

      # --max-age-days 14: since this manifest started naming an exact `rev`,
      # the pin has been bumped every one to two days, so fourteen is several
      # times the observed cadence -- wide enough that a quiet fortnight is not
      # a false alarm, tight enough to catch a pin left to rot, which is the
      # failure the comments in this file already record happening in the
      # sibling bindings. Age rather than commit count, because age is what
      # bumping the pin clears.
      - name: Check the pinned engine revision
        run: |
          python3 carve-rs/tools/check-engine-pin.py \
            --engine carve-rs --github --max-age-days 14 \
            --form cargo --manifest Cargo.toml --lock Cargo.lock

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test Rust wrapper
        run: cargo test
      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown

      - name: Check crate payload
        run: |
          cargo package --list > package-files.txt
          if grep -Eq '^(\.github/|\.gitignore$|tests/)' package-files.txt; then
            echo "development-only files entered the crate payload"
            cat package-files.txt
            exit 1
          fi

      # `cargo test` exercises the NATIVE build of the wrapper; it never proves
      # the wasm package users actually load works. Build the real artifact and
      # drive it through the JS API, so a stale or broken engine fails here
      # instead of shipping (carve-go's embedded engine went months stale with
      # a fully green suite for exactly this reason).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build the wasm package
        run: wasm-pack build --target nodejs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the wasm artifact through its JS API
        run: node tests/smoke.mjs

      # smoke.mjs asserts HAND-WRITTEN expectations, which a drifted engine pin
      # satisfies happily -- that is how carve-py's pin sat months behind with
      # CI green. The corpus is the only check that can tell a drifted pin from
      # a current one, and it measures the BINDING too: the engine being
      # corpus-checked upstream says nothing about whether wasm-bindgen loses
      # something on the way through.
      #
      # AGAINST THE SPEC COMMIT THE PINNED ENGINE PINS, not against spec main.
      # That difference is deliberate and it is a NARROWING, so it is worth
      # stating why.
      #
      # This used to check out markup-carve/carve at its default branch, which
      # asks: is this package conformant with the spec as it stands right now?
      # carve-wasm cannot answer yes to that by any change of its own. The spec
      # adds documents continuously - it gained corpus category 367 on
      # 2026-08-18 - and an engine implements them some time later. In between,
      # every pull request here is red for a reason that has nothing to do with
      # its diff, and the fix lives in another repository. A gate in that state
      # teaches every reader to skip it, and a gate nobody reads is a check that
      # cannot fail arriving by a different road (markup-carve/carve#755).
      #
      # It was not hypothetical. The same spec-main checkout in release.yml
      # stopped the sibling binding carve-py mid-release: v0.1.1 built all three
      # wheels and published its GitHub release, then skipped the PyPI upload
      # over two category-367 documents that do not exist at the spec commit
      # that release pins and that no engine revision available that day
      # rendered. PyPI went on serving the version the security fix was for.
      #
      # The question this repository CAN answer, and the only one it can act on,
      # is whether the package is as conformant as the engine it was built from.
      # scripts/pinned-spec-commit.py resolves that: the carve-rs revision
      # Cargo.toml pins, cross-checked against what Cargo.lock resolved, and
      # that revision's tests/spec gitlink. Bumping the pin is the action that
      # clears a failure here, and it is an action taken in this repository.
      #
      # WHAT THIS DOES NOT BUY, said plainly: a package that is simply OLD, with
      # the pin and the engine agreeing on a carve-rs from a month ago, passes
      # here. That is what corpus-drift below reports, and it is why deleting
      # corpus-drift would turn this into a loosening rather than a re-aiming.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          # fetch-depth: 0 so the pinned revision can be read as a tree. A
          # shallow clone has the tip's tree and nothing else, and the pin is
          # deliberately not required to be the tip.
          fetch-depth: 0

      - name: Resolve the spec commit the pinned engine pins
        id: pin
        run: |
          spec="$(python3 scripts/pinned-spec-commit.py \
            --engine carve-rs --manifest Cargo.toml --lock Cargo.lock)"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Check out the spec corpus that engine was written against
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          ref: ${{ steps.pin.outputs.spec }}
          path: spec

      - name: Corpus
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: node tests/corpus.mjs

      # For corpus-drift below. It measures the SAME wasm package this job
      # gated rather than building a second one: two builds would be two
      # artifacts, and the drift number would be about the one nothing else
      # looked at.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-pkg
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  # The lockfile is committed, so ONE resolution now serves every consumer -
  # including anyone on the `rust-version` this crate advertises. That is what
  # makes an MSRV job load-bearing rather than ceremony: while the manifest
  # tracked carve-rs unpinned with no lock, a 1.75 consumer got MSRV-aware
  # resolution from their own cargo and nothing here could break them. Pinning
  # took that freedom away.
  #
  # `--locked` is the whole point. Without it cargo may re-resolve and quietly
  # succeed, which is exactly the shape of check that cannot fail. A plain
  # `cargo generate-lockfile` picks wasm-bindgen 0.2.126 (requires Rust 1.77);
  # regenerate with CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback and this
  # job stays green.
  msrv:
    name: Build on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - run: cargo check --locked --target wasm32-unknown-unknown

  # The same corpus comparison against spec MAIN, REPORTED and not gated.
  #
  # This is the other half of re-aiming the corpus gate above, and it is not
  # optional. The question that gate no longer asks - how far is this package
  # from the spec as it stands today - is still worth knowing; it is simply not
  # something a pull request here can fix, so it must not block one. Deleting
  # this job would leave the drift invisible and turn the re-aiming into a
  # loosening. carve-go carries the identical pair for the identical reason.
  #
  # The schedule at the top of this file is what makes it useful: the spec moves
  # without a commit here, so a push-triggered run alone would report the state
  # of the day someone last touched this repository.
  #
  # IT IS NOT A CHECK THAT CANNOT FAIL. It never fails ON the number, but it
  # fails when it did not MEASURE one: a corpus that moved, a spec layout this
  # no longer finds, a package that will not load. Those are the ways a
  # reporting job silently becomes decoration, and the guard against them is
  # requiring evidence of a measurement rather than an exit status - the run has
  # to have logged either a divergence count or a byte-identical count.
  corpus-drift:
    name: Report the drift against spec main
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Check out the spec corpus at main
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: spec

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download the wasm package the corpus gate ran over
        uses: actions/download-artifact@v4
        with:
          name: ci-pkg
          path: pkg

      - name: Report the drift
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          set -uo pipefail
          # tests/corpus.mjs exits non-zero on divergence. Here divergence is
          # the thing being reported, so the exit status is discarded and the
          # LOG is what is read; a run that logged no count at all still fails
          # below.
          node tests/corpus.mjs > drift.log 2>&1 || true
          cat drift.log
          spec="$(git -C spec rev-parse --short HEAD)"
          diverging="$(grep -oE '[0-9]+/[0-9]+ corpus documents differ' drift.log | tail -1 || true)"
          identical="$(grep -oE '[0-9]+/[0-9]+ documents byte-identical' drift.log | tail -1 || true)"
          if [ -n "$diverging" ]; then
            headline="$diverging at spec main ($spec)"
          elif [ -n "$identical" ]; then
            headline="0 diverging, $identical at spec main ($spec)"
          else
            echo "::error::the drift run logged neither a divergence count nor a byte-identical count, so nothing was measured" >&2
            tail -40 drift.log >&2
            exit 1
          fi
          echo "$headline"
          echo "::notice::$headline"
          {
            echo "## The published package against spec main"
            echo
            echo "$headline"
          } >> "$GITHUB_STEP_SUMMARY"
