[package]
name = "carve-wasm"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "WASM bindings for the Carve parser and HTML renderer."
license = "MIT"
repository = "https://github.com/markup-carve/carve-wasm"
homepage = "https://markup-carve.github.io/carve/"
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Keep the published package's API backward-compatible. Browser hosts that only
# render Carve to HTML can omit every other capability with
# `--no-default-features`.
default = [
    "ast-json",
    "html-import",
    "lint",
    "markdown-import",
    "other-imports",
    "other-renderers",
    "reports",
    "stamp",
]
ast-json = []
html-import = []
lint = []
markdown-import = []
# The importers a Markdown-shaped host does not need: Djot and BBCode.
other-imports = []
other-renderers = []
reports = []
stamp = []

[dependencies]
# Pinned to an exact carve-rs commit, the same way carve-rb pins it. Tracking
# the default branch made every build resolve whatever had landed since,
# so the published package could carry an engine no CI run here had ever
# built. Bump it deliberately: see "carve-rs dependency pin" in the README.
carve = { package = "carve-lang", git = "https://github.com/markup-carve/carve-rs", rev = "da45f9d22cb503398d30351f3a5c08f4792122fb" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
