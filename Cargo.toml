[package]
name = "carve-wasm"
version = "0.1.12"
edition = "2021"
rust-version = "1.85"
description = "WASM bindings for the Carve parser and HTML renderer."
license = "MIT"
repository = "https://github.com/markup-carve/carve-wasm"
homepage = "https://markup-carve.github.io/carve/"
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The full development package includes the 0.2 operations currently exposed by
# the engine. The render-only entry uses --no-default-features.
default = ["ast-json", "html-import", "includes", "lint", "other-renderers", "reports", "source-patches"]
ast-json = []
html-import = []
includes = []
lint = []
other-renderers = []
reports = []
source-patches = []

[dependencies]
# Pin an exact Git revision or registry version.
# scripts/pinned-spec-commit.py resolves the revision, or the registry release
# tag, to the spec the corpus gate runs against. See
# docs/engine-pin.md.
carve = { git = "https://github.com/markup-carve/carve-rs", rev = "7fb7c24956298e78bc4716ff7e0e1fb96e60ecdf", package = "carve-lang", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
# Already in the tree through the engine; named here because this crate builds
# its own JSON results rather than only forwarding the engine's.
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
