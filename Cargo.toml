[package]
name = "carve-wasm"
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
description = "WASM bindings for the Carve parser and HTML renderer."
license = "MIT"
repository = "https://github.com/markup-carve/carve-wasm"
homepage = "https://markup-carve.github.io/carve/"
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Keep the published package's API backward-compatible. Browser hosts that only
# render Carve to HTML can omit every other capability with
# `--no-default-features`.
default = [
    "ast-json",
    "ast-merge",
    "ast-patches",
    "html-import",
    "includes",
    "incremental",
    "lint",
    "markdown-import",
    "other-imports",
    "other-renderers",
    "prosemirror",
    "reports",
    "source-patches",
    "stamp",
]
ast-json = []
# Three-way merge of PART 12 trees.
ast-merge = []
# Tree-level patch creation and replay, including the reversible pair.
ast-patches = []
html-import = []
# `{{ path }}` expansion. Needs a host that can resolve a path synchronously,
# which a browser fetching over the network cannot.
includes = []
# Snapshot parsing and edit-validated re-parse, for an editor host.
incremental = []
lint = []
markdown-import = []
# The importers a Markdown-shaped host does not need: Djot and BBCode.
other-imports = []
other-renderers = []
# The ProseMirror/CarveKit bridge. A rendering-only host does not edit.
prosemirror = []
reports = []
source-patches = []
stamp = []

[dependencies]
# Pinned to an exact carve-rs commit, the same way carve-rb pins it. Tracking
# the default branch made every build resolve whatever had landed since,
# so the published package could carry an engine no CI run here had ever
# built. Bump it deliberately: see docs/engine-pin.md.
carve = { package = "carve-lang", git = "https://github.com/markup-carve/carve-rs", rev = "d7837249c64b88879b04cd71b8b5555ff246e16f" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
# Already in the tree through the engine; named here because this crate builds
# its own JSON results rather than only forwarding the engine's.
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
