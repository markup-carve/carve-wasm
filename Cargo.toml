[package]
name = "carve-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "WASM bindings for the Carve parser and HTML renderer."
license = "MIT"
repository = "https://github.com/markup-carve/carve-wasm"
homepage = "https://markup-carve.github.io/carve/"
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to an exact carve-rs commit, the same way carve-rb pins it. Tracking
# the default branch made every build resolve whatever had landed since,
# so the published package could carry an engine no CI run here had ever
# built. Bump it deliberately: see "carve-rs dependency pin" in the README.
carve = { package = "carve-lang", git = "https://github.com/markup-carve/carve-rs", rev = "f2fbb24c559a0c1856cd5b604660a6c8f03278de" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
